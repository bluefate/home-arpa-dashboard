# Pull-only deploy (no git clone / Dockerfile on the host).
#
#   mkdir arpa-dashboard && cd arpa-dashboard
#   curl -fsSL -o docker-compose.yml \
#     https://raw.githubusercontent.com/bluefate/home-arpa-dashboard/main/docker-compose.yml
#   curl -fsSL -o .env \
#     https://raw.githubusercontent.com/bluefate/home-arpa-dashboard/main/.env.example
#   # edit .env — set API_KEY and CADDY_IP
#   mkdir -p data
#   docker compose up -d
#
# Update:
#   docker compose pull && docker compose up -d
#
# Image published from main → ghcr.io/bluefate/home-arpa-dashboard
# If the package is private: Packages → change visibility to Public,
# or: echo $GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin

services:
  arpa-dashboard:
    image: ghcr.io/bluefate/home-arpa-dashboard:latest
    container_name: arpa-dashboard
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      # Optional: mount a path Caddy can import
      # - ./caddy/arpa-dashboard.caddy:/snippets/arpa-dashboard.caddy
    # Uncomment and set CADDY_SNIPPET_PATH=/snippets/arpa-dashboard.caddy in .env
